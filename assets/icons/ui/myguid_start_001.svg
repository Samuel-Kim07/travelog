    <rect width="24" height="24" fill="white" />
    <path d="M 12 2 C 8.5 2 5.8 4.7 5.8 8.2 C 5.8 12.8 12 18 12 18 C 12 18 18.2 12.8 18.2 8.2 C 18.2 4.7 15.5 2 12 2 Z" fill="black" />
